# Minimal first-run template for an objective data-workload metric.
# Start here when "better" is a scalar from a measurement harness (runtime, cost,
# bytes scanned) AND you can prove the model still returns the same data.
#
# This example tunes a slow gold model for runtime while a hard parity gate
# guarantees the output rows are byte-for-byte unchanged.

name: speed-up-gold-orders
description: Cut the build time of the gold orders mart without changing its output

metric:
  primary:
    type: hard
    name: build_seconds
    direction: minimize
  degenerate_gates:
    # Output-parity gate: the tuned model MUST return the same data as baseline.
    # The measure script emits these by diffing the rebuilt table against a snapshot.
    - name: rowcount_delta
      check: "== 0"
      description: Same number of rows as the baseline build
    - name: checksum_match
      check: "== 1"
      description: Hash over key + measure columns matches the baseline (no value drift)
    - name: tests_failed
      check: "== 0"
      description: All dbt tests on this model and its children still pass
  diagnostics:
    - name: bytes_scanned_mb
    - name: rows_built

measurement:
  # evaluate.py: rebuilds the model, times it, snapshots + diffs the output,
  # runs the model's dbt tests, and prints one JSON object with the keys above.
  command: "python evaluate.py --model gold_orders"
  timeout_seconds: 600
  working_directory: "analytics"
  stability:
    mode: repeat
    repeat_count: 3
    aggregation: median
    noise_threshold: 0.05 # warehouse runtime is noisy; need >5% to count as a real win

scope:
  mutable:
    - "analytics/models/gold/gold_orders.sql"
    - "analytics/models/gold/gold_orders.yml" # materialization, cluster/partition, incremental config
  immutable:
    - "analytics/evaluate.py" # the harness never changes mid-run
    - "analytics/snapshots/" # baseline snapshot used for the parity diff
    - "analytics/models/staging/" # upstream contract is fixed for this run

execution:
  mode: serial
  backend: worktree
  max_concurrent: 1

parallel:
  port_strategy: none
  shared_files: []

dependencies:
  approved: []

constraints:
  - "Output data must be identical - the parity gate is non-negotiable"
  - "Do not change the model's grain, primary key, or column set"
  - "Do not weaken or drop any dbt test"

stopping:
  max_iterations: 4
  max_hours: 1
  plateau_iterations: 3
  target_reached: true

max_runner_up_merges_per_batch: 0
