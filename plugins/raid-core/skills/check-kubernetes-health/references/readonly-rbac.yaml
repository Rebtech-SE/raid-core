# Read-only access for check-kubernetes-health. Grants get/list/watch on what the
# script reads, plus pod logs for diagnosis. No Secrets, no write verbs.
# Apply once, by a cluster admin:  kubectl apply -f readonly-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-health-reader
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-health-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-health-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-health-reader
subjects:
  - kind: ServiceAccount
    name: k8s-health-reader
    namespace: monitoring
